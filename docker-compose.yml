# Local development database. Start with `docker compose up -d`.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: roast
      POSTGRES_PASSWORD: roast
      POSTGRES_DB: roast_copilot
    ports:
      - "54320:5432"
    volumes:
      - roast-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roast -d roast_copilot"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  roast-db:
